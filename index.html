<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神諭牌占卜工作室</title>
<style>
body{margin:0;background:#f5efe7;color:#332d29;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center}
main{max-width:480px;margin:auto;padding:48px 22px}
h1{font-size:30px}
p{line-height:1.8}
.card{background:#fffaf3;border:1px solid #d8c6b4;border-radius:20px;padding:38px 18px;margin:30px 0;box-shadow:0 8px 25px #0001}
button{background:#41342d;color:white;border:0;border-radius:12px;padding:17px 35px;font-size:18px;cursor:pointer}
#result{font-size:23px;font-weight:bold;margin:18px 0}
small{color:#796e66}
</style>
</head>
<body>
<main>
<h1>☾ 神諭牌占卜工作室</h1>
<p>靜下心來，想著你想詢問的問題。<br>讓神諭牌為你帶來一份指引。</p>
<div class="card">
<div style="font-size:54px">✦</div>
<div id="result">準備好接收指引了嗎？</div>
<p id="meaning">點擊下方按鈕，抽出你的神諭牌。</p>
</div>
<button onclick="drawCard()">洗牌並抽一張牌</button>
<p><small>占卜結果供自我探索與參考</small></p>
</main>
<script>
const cards=[
["老鼠與毛茛","純真"],
["貓與薰衣草","獨立"],
["蜘蛛與西番蓮","獨創力"],
["野兔與橡樹","新的契機"],
["熊與雪松","領導力"],
["綿羊與黑莓","奉獻"],
["青蛙與蓮花","蛻變"],
["花栗鼠與月桂","成功"],
["麋鹿與梣樹","力量"],
["黃鼠狼與松樹","反省"],
["鴨子與菊花","幸運"],
["山羊與柳樹","克服障礙"],
["蜥蜴與豬籠草","停滯"],
["蛾與尤加利","結束"],
["禿鷹與阿福花","動盪"],
["鹿與燕麥","療癒"],
["烏鴉與山茱萸","智力"],
["蠑螈與黑胡椒","靈感"],
["野豬與南瓜","信心"],
["蝙蝠與鐵筷子花","直覺"],
["鱷魚與罌粟花","夢想"],
["臭鼬與木蘭花","保護"],
["貓頭鷹與啤酒花","智慧"],
["獵犬與西洋梨","忠誠"],
["貂與毛地黃","淘氣"],
["狼與玫瑰果","守護"],
["蜜蜂與石榴","生產力"],
["狐狸與常春藤","適應力"],
["負鼠與牡丹花","羞怯"],
["松鼠與栗子","準備"],
["河狸與樺樹","家園"],
["烏龜與芫荽","滿足"],
["獾與銀杏","傷口癒合"],
["浣熊與美國梧桐","好奇心"],
["蛇與蕨類","重新開始"],
["瓢蟲與香豌豆","快樂"],
["雀與桃子","戀情"],
["郊狼與曼陀羅花","欺騙"],
["豪豬與銀蓮花","界線"],
["水獺與香蒲","平靜"],
["山貓與黑刺李","耐心"],
["蝸牛與越橘","無形中的信任"],
["鰻魚與鳶尾花","安全感"],
["鱒魚與鈴蘭花","淨化"],
["老鷹與薊花","優雅的毅力"],
["羚羊與小麥","滋養"],
["蝴蝶與雪花蓮","希望"],
["公雞與向日葵","溝通"],
["蜻蜓與三色堇","平衡"],
["馬與藍鈴花","適度的剛毅"],
["大公羊與大麗花","決心"],
["鵪鶉與鵝莓","預期"]
];
function drawCard(){
const i=Math.floor(Math.random()*cards.length);
const reversed=Math.random()<0.5;
document.getElementById("result").textContent="#"+i+" "+cards[i][0]+"（"+(reversed?"逆位":"正位")+"）";
document.getElementById("meaning").textContent="關鍵字："+cards[i][1]+"。"+(reversed?"這張牌提醒你留意目前的阻礙與內在失衡，重新調整方向。":"這張牌鼓勵你發揮這份特質，為目前的問題尋找新的可能。");
}
</script>
</body>
</html>
