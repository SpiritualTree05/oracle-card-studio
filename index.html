
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我與肥貓·神諭占卜</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#100d0a;
  color:#ebd4ae;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
}
main{
  max-width:600px;
  margin:auto;
  padding:28px 20px 50px;
}
section{display:none}
section.active{display:block}

/* 黑貓封面 */
body:has(#home.active) main{
  max-width:1024px;
  padding:0;
}
body:has(#home.active) footer{
  display:none;
}
.cover{
  position:relative;
  width:100%;
}
.cover img{
  display:block;
  width:100%;
  height:auto;
}
.hotspot{
  position:absolute;
  display:block;
  padding:0;
  margin:0;
  border:0;
  border-radius:0;
  background:transparent;
  cursor:pointer;
}
.hotspot:focus-visible{
  outline:3px solid #e7b56d;
  outline-offset:-3px;
}
.start{
  left:22%;
  top:57.8%;
  width:56%;
  height:5.7%;
}
.feature1{
  left:5%;
  top:65.5%;
  width:44%;
  height:11.2%;
}
.feature2{
  right:5%;
  top:65.5%;
  width:44%;
  height:11.2%;
}
.feature3{
  left:5%;
  top:77.8%;
  width:44%;
  height:10.8%;
}
.feature4{
  right:5%;
  top:77.8%;
  width:44%;
  height:10.8%;
}

/* 內頁 */
h2{
  font-size:27px;
  line-height:1.5;
}
p{
  color:#c4b4a2;
  line-height:1.9;
}
button{
  cursor:pointer;
  width:100%;
  padding:16px 20px;
  margin-top:14px;
  border:1px solid #a98454;
  border-radius:13px;
  background:#c9a16a;
  color:#17120f;
  font-size:17px;
  font-weight:700;
}
button.secondary{
  background:transparent;
  color:#dfc18e;
}
.panel{
  border:1px solid #594833;
  background:#1d1a17;
  border-radius:18px;
  padding:22px;
  margin:16px 0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin:25px 0;
}
.choice{
  border:1px solid #705537;
  border-radius:16px;
  padding:20px 12px;
  background:#211c17;
  text-align:center;
  cursor:pointer;
}
.choice b{
  display:block;
  font-size:19px;
  margin:10px 0;
}
.choice small{
  color:#b9a999;
  line-height:1.6;
}
.symbol{font-size:30px}
textarea{
  width:100%;
  min-height:110px;
  margin-top:10px;
  padding:15px;
  border:1px solid #806342;
  border-radius:10px;
  background:#171411;
  color:#f5e4c8;
  font:inherit;
}
#result{display:none}
footer{
  text-align:center;
  border-top:1px solid #46382b;
  padding:24px;
  color:#bca587;
  font-size:13px;
}
@media(max-width:350px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<main>

<!-- 第一頁：正式黑貓封面 -->
<section id="home" class="active">
  <div class="cover">
    <img
      src="18B334E2-A47B-4FFC-B53E-040793AACE58.png"
      alt="我與肥貓·神諭占卜黑貓封面"
    >

    <button class="hotspot start"
      aria-label="開始探索占卜服務"
      onclick="go('services')"></button>

    <button class="hotspot feature1"
      aria-label="52張神諭牌"
      onclick="go('services')"></button>

    <button class="hotspot feature2"
      aria-label="深度探索"
      onclick="go('services')"></button>

    <button class="hotspot feature3"
      aria-label="付款方式"
      onclick="showInfo('payment')"></button>

    <button class="hotspot feature4"
      aria-label="尊重隱私"
      onclick="showInfo('privacy')"></button>
  </div>
</section>

<!-- 第二頁：選擇占卜服務 -->
<section id="services">
  <h2>選擇占卜服務</h2>
  <p>請選擇最接近你目前疑惑的方向。</p>

  <div class="grid">
    <div class="choice" role="button" tabindex="0"
      onclick="choose('感情占卜')"
      onkeydown="if(event.key==='Enter')choose('感情占卜')">
      <span class="symbol">♡</span>
      <b>感情占卜</b>
      <small>曖昧、復合、桃花、關係</small>
    </div>

    <div class="choice" role="button" tabindex="0"
      onclick="choose('事業占卜')"
      onkeydown="if(event.key==='Enter')choose('事業占卜')">
      <span class="symbol">♧</span>
      <b>事業占卜</b>
      <small>工作、轉職、創業、發展</small>
    </div>

    <div class="choice" role="button" tabindex="0"
      onclick="choose('財運占卜')"
      onkeydown="if(event.key==='Enter')choose('財運占卜')">
      <span class="symbol">◇</span>
      <b>財運占卜</b>
      <small>財務、收入、金錢規劃</small>
    </div>

    <div class="choice" role="button" tabindex="0"
      onclick="choose('靈性指引')"
      onkeydown="if(event.key==='Enter')choose('靈性指引')">
      <span class="symbol">☾</span>
      <b>靈性指引</b>
      <small>內在探索、人生方向</small>
    </div>
  </div>

  <button class="secondary" onclick="go('home')">
    ← 返回品牌首頁
  </button>
</section>

<!-- 第三頁：抽牌 -->
<section id="reading">
  <h2 id="topic">神諭牌占卜</h2>
  <p>靜下心來，想著你想詢問的問題。</p>

  <label for="question">你的問題（可選填）</label>
  <textarea id="question"
    placeholder="請輸入想詢問的事情"></textarea>

  <button onclick="draw()">洗牌並抽一張神諭牌</button>

  <div id="result" class="panel">
    <h2 id="cardname"></h2>
    <p id="meaning"></p>
  </div>

  <button class="secondary" onclick="go('services')">
    ← 返回服務選單
  </button>
</section>

<!-- 資訊頁 -->
<section id="info">
  <h2 id="infoTitle"></h2>
  <div class="panel">
    <p id="infoText"></p>
  </div>
  <button class="secondary" onclick="go('home')">
    ← 返回品牌首頁
  </button>
</section>

</main>

<footer>© 我與肥貓·神諭占卜</footer>

<script>
const names = "老鼠與毛茛|貓與薰衣草|蜘蛛與西番蓮|野兔與橡樹|熊與雪松|綿羊與黑莓|青蛙與蓮花|花栗鼠與月桂|麋鹿與梣樹|黃鼠狼與松樹|鴨子與菊花|山羊與柳樹|蜥蜴與豬籠草|蛾與尤加利|禿鷹與阿福花|鹿與燕麥|烏鴉與山茱萸|蠑螈與黑胡椒|野豬與南瓜|蝙蝠與鐵筷子花|鱷魚與罌粟花|臭鼬與木蘭花|貓頭鷹與啤酒花|獵犬與西洋梨|貂與毛地黃|狼與玫瑰果|蜜蜂與石榴|狐狸與常春藤|負鼠與牡丹花|松鼠與栗子|河狸與樺樹|烏龜與芫荽|獾與銀杏|浣熊與美國梧桐|蛇與蕨類|瓢蟲與香豌豆|雀與桃子|郊狼與曼陀羅花|豪豬與銀蓮花|水獺與香蒲|山貓與黑刺李|蝸牛與越橘|鰻魚與鳶尾花|鱒魚與鈴蘭花|老鷹與薊花|羚羊與小麥|蝴蝶與雪花蓮|公雞與向日葵|蜻蜓與三色堇|馬與藍鈴花|大公羊與大麗花|鵪鶉與鵝莓".split("|");

const words = "純真|獨立|獨創力|新的契機|領導力|奉獻|蛻變|成功|力量|反省|幸運|克服障礙|停滯|結束|動盪|療癒|智力|靈感|信心|直覺|夢想|保護|智慧|忠誠|淘氣|守護|生產力|適應力|羞怯|準備|家園|滿足|傷口癒合|好奇心|重新開始|快樂|戀情|欺騙|界線|平靜|耐心|無形中的信任|安全感|淨化|優雅的毅力|滋養|希望|溝通|平衡|適度的剛毅|決心|預期".split("|");

let selected = "神諭占卜";

function go(id){
  document.querySelectorAll("section").forEach(
    x => x.classList.remove("active")
  );
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function choose(topic){
  selected=topic;
  document.getElementById("topic").textContent=topic;
  document.getElementById("result").style.display="none";
  go("reading");
}

function showInfo(type){
  const title=document.getElementById("infoTitle");
  const text=document.getElementById("infoText");

  if(type==="payment"){
    title.textContent="付款方式";
    text.textContent="LINE Pay Money、銀行轉帳";
  }else{
    title.textContent="尊重隱私";
    text.textContent=
      "我們重視你的個人資料與占卜問題，並將提供清楚的資料處理與隱私說明。";
  }
  go("info");
}

function draw(){
  const i=Math.floor(Math.random()*names.length);
  const reverse=Math.random()<0.5;
  const side=reverse?"逆位":"正位";

  document.getElementById("cardname").textContent=
    "#"+i+" "+names[i]+"（"+side+"）";

  document.getElementById("meaning").textContent=
    "關鍵字："+words[i]+"。這張牌在"+selected+
    "的問題中，"+
    (reverse
      ?"提醒你留意阻礙、情緒與尚未處理的課題，先調整步調。"
      :"鼓勵你從這項特質尋找新的方向，並以實際行動逐步前進。");

  document.getElementById("result").style.display="block";
}
</script>
</body>
</html>
