<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我與肥貓·神諭占卜｜互動測試版</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#100d0a;color:#f0dfbc;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}main{max-width:720px;margin:auto;padding:24px 18px 100px}header{text-align:center;padding:34px 0 24px;background:radial-gradient(ellipse at 50% 0,#554020 0,transparent 72%)}h1{font-family:serif;font-size:29px;letter-spacing:2px;margin:14px 0 8px}h2{font-size:23px;color:#eacb85;margin:4px 0 16px}h3{font-size:17px;color:#e5c580;margin:22px 0 8px}p{line-height:1.85}small,.muted{color:#ad9b81}.moon{font-size:45px;color:#e6c77f}.pill{display:inline-block;border:1px solid #8e7143;border-radius:30px;padding:5px 13px;color:#d9bd84;font-size:12px}.panel{border:1px solid #6c5330;background:linear-gradient(135deg,#231b15,#17120f);border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{background:linear-gradient(#d7b87c,#ad8548);color:#20170d;border:0;border-radius:11px;padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:12px}.btn.alt{background:#2b221a;color:#e8d1a2;border:1px solid #79603d}.btn.danger{background:#562c29;color:#ffdfd9}.btn:disabled{opacity:.45}label{display:block;color:#d7bc87;margin:14px 0 6px;font-size:14px}input,select,textarea{width:100%;background:#130f0d;color:#f3e3c5;border:1px solid #6b5435;border-radius:10px;padding:13px;font-size:16px}textarea{min-height:150px;line-height:1.6;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.hidden{display:none!important}.rule{height:1px;background:#4e3b25;margin:22px 0}.report p{margin:8px 0 15px}.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.oracle{height:116px;background:radial-gradient(ellipse,#5b452b,#17110d);border:1px solid #bd9654;border-radius:10px;color:#e5c98d;font-size:28px;cursor:pointer;box-shadow:inset 0 0 0 4px #261d15}.oracle:disabled{opacity:.4}.notice{background:#312418;border-left:3px solid #d6b576;padding:12px 14px;border-radius:6px;line-height:1.7}.status{font-size:13px;border:1px solid #947547;border-radius:18px;padding:5px 9px;color:#f0d18d}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.nav button{width:auto;margin:0;padding:10px 13px}.money{font-size:35px;color:#f0ce87;font-weight:700;text-align:center}.footer{text-align:center;color:#998468;font-size:12px;padding:28px}.step{color:#e3c480;font-size:12px;letter-spacing:2px;text-transform:uppercase}ul{line-height:1.85;padding-left:20px}@media(min-width:600px){.card-grid{grid-template-columns:repeat(8,1fr)}.oracle{height:110px}}</style></head><body><main><header><div class="moon">☾</div><h1>我與肥貓·神諭占卜</h1><p class="muted">每日命理指引 · 本週神諭解讀</p><span class="pill">互動測試版｜不會實際收款</span></header><div class="nav"><button class="btn alt" onclick="go('home')">首頁</button><button class="btn alt" onclick="go('daily')">每日運勢</button><button class="btn alt" onclick="go('orders')">我的訂單</button><button class="btn alt" onclick="go('admin')">測試後台</button></div><div id="app"></div><div class="footer">我與肥貓·神諭占卜｜功能測試環境<br>占卜內容為象徵性自我探索，不保證未來事件。</div></main><script>
const names=['老鼠與毛茛','貓與薰衣草','蜘蛛與西番蓮','野兔與橡樹','熊與雪松','綿羊與黑莓','青蛙與蓮花','花栗鼠與月桂','麋鹿與梣樹','黃鼠狼與松樹','鴨子與菊花','山羊與柳樹','蜥蜴與豬籠草','蛾與尤加利','禿鷹與阿福花','鹿與燕麥','烏鴉與山茱萸','蠑螈與黑胡椒','野豬與南瓜','蝙蝠與鐵筷子花','鱷魚與罌粟花','臭鼬與木蘭花','貓頭鷹與啤酒花','獵犬與西洋梨','貂與毛地黃','狼與玫瑰果','蜜蜂與石榴','狐狸與常春藤','負鼠與牡丹花','松鼠與栗子','河狸與樺樹','烏龜與芫荽','獾與銀杏','浣熊與美國梧桐','蛇與蕨類','瓢蟲與香豌豆','雀與桃子','郊狼與曼陀羅花','豪豬與銀蓮花','水獺與香蒲','山貓與黑刺李','蝸牛與越橘','鰻魚與鳶尾花','鱒魚與鈴蘭花','老鷹與薊花','羚羊與小麥','蝴蝶與雪花蓮','公雞與向日葵','蜻蜓與三色堇','馬與藍鈴花','大公羊與大麗花','鵪鶉與鵝莓'];
const keys=['純真','獨立','獨創力','新的契機','領導力','奉獻','蛻變','成功','力量','反省','幸運','克服障礙','停滯','結束','動盪','療癒','智力','靈感','信心','直覺','夢想','保護','智慧','忠誠','淘氣','守護','生產力','適應力','羞怯','準備','家園','滿足','傷口癒合','好奇心','重新開始','快樂','戀情','欺騙','界線','平靜','耐心','無形中的信任','安全感','淨化','優雅的毅力','滋養','希望','溝通','平衡','適度的剛毅','決心','預期'];
const topics=['感情運勢','事業運勢','財運狀態','靈性指引'];const $=x=>document.getElementById(x);const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let profile=read('oracle_profile',{}),orders=read('oracle_orders',[]),settings=read('oracle_settings',{test:true}),current=null,route='home';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const fmt=d=>new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'long',day:'numeric'}).format(new Date(d+'T12:00:00+08:00'));const add=(d,n)=>{let t=new Date(d+'T12:00:00+08:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function life(b){let n=b.replace(/\D/g,'').split('').reduce((a,c)=>a+Number(c),0);while(n>9&&n!==11&&n!==22&&n!==33)n=String(n).split('').reduce((a,c)=>a+Number(c),0);return n}function go(x){route=x;render();scrollTo(0,0)}function info(){return '<div class="notice">這是示範流程：未接真實銀行、LINE 通知、身分驗證、農民曆資料源或 AI 服務。測試資料只存放在目前這個瀏覽器。</div>'}function render(){let a=$('app');if(route==='home')a.innerHTML=`<div class="panel"><div class="step">01 FREE DAILY READING</div><h2>每日專屬運勢</h2><p>依照姓名、生日、出生時辰與居住地，查看今日整體、感情、事業、財運及身心指引。</p><button class="btn" onclick="go('daily')">查看今日免費運勢</button></div><div class="panel"><div class="step">02 WEEKLY ORACLE</div><h2>本週專屬神諭占卜</h2><p>選擇一個主題，描述真實處境，付款確認後親手抽取52張神諭牌中的一張，查看未來七天的深入解讀。</p><div class="money">NT$100 <small>／單一主題</small></div><button class="btn alt" onclick="go('topic')">體驗付費占卜流程</button></div>${info()}`;
else if(route==='daily')a.innerHTML=`<div class="panel"><div class="step">每日運勢 · 基本資料</div><h2>認識今日的自己</h2><form onsubmit="submitProfile(event)"><label>姓名或稱呼</label><input id="pname" required maxlength="60" value="${esc(profile.name)}" placeholder="例如：小安"><label>國曆生日</label><input id="pbirth" required type="date" max="${today()}" value="${esc(profile.birth)}"><label>出生時辰</label><select id="phour">${['不清楚','子時','丑時','寅時','卯時','辰時','巳時','午時','未時','申時','酉時','戌時','亥時'].map(v=>`<option ${profile.hour===v?'selected':''}>${v}</option>`).join('')}</select><label>居住縣市</label><input id="pcity" required maxlength="80" value="${esc(profile.city)}" placeholder="例如：台北市"><button class="btn">產生今日免費運勢</button></form></div>`;
else if(route==='dailyReport')dailyReport(a);
else if(route==='topic')a.innerHTML=`<div class="panel"><div class="step">付費神諭 · 第一步</div><h2>選擇本週占卜主題</h2><p>每次 NT$100，選擇一個你最想深入了解的方向。</p><div class="grid">${topics.map((v,i)=>`<button class="btn alt" onclick="choose(${i})">${v}</button>`).join('')}</div></div>`;
else if(route==='context')contextPage(a);
else if(route==='payment')paymentPage(a);
else if(route==='orders')ordersPage(a);
else if(route==='admin')adminPage(a);
else if(route==='draw')drawPage(a);
else if(route==='report')weeklyReport(a)}
function submitProfile(e){e.preventDefault();profile={name:$('pname').value.trim(),birth:$('pbirth').value,hour:$('phour').value,city:$('pcity').value.trim()};if(!profile.name||!profile.city)return;save('oracle_profile',profile);go('dailyReport')}
function dailyReport(a){let d=today(),k=hash(profile.name+profile.birth+profile.hour+profile.city+d),n=life(profile.birth),old=read('oracle_daily',{});old[hash(profile.name+profile.birth+profile.hour+profile.city)+':'+d]={date:d};save('oracle_daily',old);let trend=['整理節奏','修復關係','清楚表達','累積實力','照顧界線'][k%5];a.innerHTML=`<div class="panel report"><div class="step">${fmt(d)} · 免費完整報告</div><h2>${esc(profile.name)}的每日專屬運勢</h2><p class="muted">${esc(profile.city)} · ${esc(profile.hour)} · 生命靈數 ${n}</p><h3>01｜今日曆法與生活節奏</h3><p>今天是${fmt(d)}。正式版本會接入經核對的農民曆資料，提供正確的農曆、干支、節氣與傳統宜忌。測試版不虛構黃曆資訊；先從你能實際掌握的生活節奏出發。</p><h3>02｜個人命理與今日影響</h3><p>你的生命靈數為 ${n}。這項數字在此作為自我觀察的象徵工具，而不是對未來的確定預測。今天的主題是「${trend}」：先看清楚最需要處理的一件事，避免同時分散在過多目標上。</p><h3>03｜今日整體運勢</h3><p>今天的重點不在於突然出現重大轉折，而是你如何處理手邊正在發生的小變化。早上適合釐清優先順序，中午留意溝通方式，傍晚則適合回顧哪些安排真正對你有幫助。當外在情況不完全如預期，保留調整空間比勉強推進更有效。</p><h3>04｜感情運勢</h3><p>感情上適合把注意力放回實際互動，而非單靠猜測對方心意。若有伴侶，可選一件具體的生活小事好好討論；若仍在曖昧或觀察期，先留意雙方投入是否對等。單身者不必急著把一次接觸解讀成關係定局。</p><h3>05｜事業運勢</h3><p>工作上先處理需要確認的細節，尤其是交辦內容、時間安排與責任分工。若有想推進的計畫，可以先做小範圍測試，累積可檢視的成果，再決定是否擴大投入。今天的效率來自減少反覆修正，而不是把行程排滿。</p><h3>06｜財運狀態</h3><p>財務上宜檢查日常支出、待付款項與近期預算。面對新的購買或投資想法，先確認用途、承受能力及資訊來源。若近期有經濟壓力，優先安排可控制的現金流，比期待單次機會翻轉更穩健。</p><h3>07｜身心狀態</h3><p>今天適合留出一段不被訊息打斷的時間。若最近持續忙碌，可以從規律吃飯、補充水分、短暫走動開始。身體的不舒服仍應依實際情況尋求專業協助，不能只以運勢解釋。</p><h3>08｜今日個人宜忌</h3><p><b>宜：</b>確認重要資訊、說清楚需求、整理一項待辦、保留休息時間。<br><b>忌：</b>衝動承諾、過度解讀他人、在壓力下做重大金錢決定。</p><h3>09｜今日綜合指引</h3><p>今天最值得練習的是，把精力用在能夠產生實際改變的地方。與其追求所有事情同時順利，不如讓一件重要的事朝正確方向前進。你可以慢一點，但要知道自己為什麼前進。</p><div class="rule"></div><h3>想進一步了解未來七天？</h3><p>免費每日運勢已完成。若有一段關係、一份工作或某個困惑需要更深入探索，可以選擇單一主題進行本週神諭占卜。</p><div class="money">NT$100</div><button class="btn" onclick="go('topic')">抽取本週專屬神諭牌</button><button class="btn alt" onclick="go('home')">回首頁</button></div>${info()}`}
function choose(i){current={id:'OR-'+Date.now().toString(36).toUpperCase(),topic:topics[i],created:today(),status:'draft',name:profile.name||'',birth:profile.birth||'',hour:profile.hour||'不清楚',city:profile.city||''};go('context')}
function contextPage(a){let love=current.topic===topics[0];a.innerHTML=`<div class="panel"><div class="step">付費神諭 · 第二步</div><h2>${current.topic}｜你的現況</h2><p>不需要另外提出問題。請用自己的方式描述發生過什麼、現在最困擾什麼；寫得越完整，正式版越能針對你的情況分析。</p><form onsubmit="submitContext(event)">${love?`<label>有沒有特定對象？</label><select id="hasperson" onchange="togglePerson()"><option value="no">沒有</option><option value="yes">有</option></select><div id="personbox" class="hidden"><label>對方稱呼（選填）</label><input id="person" maxlength="60" placeholder="姓名或暱稱即可"><label>對方生日（選填）</label><input id="personbirth" type="date"><label>目前關係</label><select id="relation">${['暗戀','曖昧','交往中','複雜／拉扯中','前任','婚姻','其他'].map(x=>`<option>${x}</option>`).join('')}</select></div>`:''}<label>目前狀況與心情</label><textarea id="story" placeholder="例如：從什麼時候開始、發生哪些轉折、目前互動如何、最想釐清什麼……可以詳細敘述，不限短短幾句。"></textarea><button class="btn">確認內容，前往付款</button></form></div>`}
function togglePerson(){$('personbox').classList.toggle('hidden',$('hasperson').value!=='yes')}
function submitContext(e){e.preventDefault();current.story=$('story').value.trim();current.hasperson=!!$('hasperson')&&$('hasperson').value==='yes';current.person=current.hasperson?$('person').value.trim():'';current.personbirth=current.hasperson?$('personbirth').value:'';current.relation=current.hasperson?$('relation').value:'';go('payment')}
function paymentPage(a){a.innerHTML=`<div class="panel"><div class="step">付費神諭 · 第三步</div><h2>付款與訂單確認</h2><p>占卜主題：<b>${esc(current.topic)}</b></p><div class="money">NT$100</div><div class="notice">正式版會顯示你設定的固定銀行帳號。此處不顯示真實收款資訊，請勿轉帳。LINE Pay 個人 QR 暫不啟用。</div><label>模擬付款方式</label><select id="method"><option>銀行轉帳（模擬）</option><option>朋友免費測試（需管理員開通）</option></select><label>轉帳末五碼（模擬，可不填）</label><input id="last5" inputmode="numeric" maxlength="5" placeholder="例如：12345"><button class="btn" onclick="submitOrder()">送出模擬訂單，等待管理員確認</button><p class="muted">這個按鈕不會真的扣款或通知銀行。</p></div>`}
function submitOrder(){current.method=$('method').value;current.last5=$('last5').value;current.status='pending';orders.unshift(current);save('oracle_orders',orders);go('orders')}
function ordersPage(a){a.innerHTML=`<div class="panel"><h2>我的訂單（測試）</h2>${orders.length?orders.map(o=>`<div class="panel"><div class="row"><b>${esc(o.topic)}</b><span class="status">${o.status==='pending'?'等待確認':o.status==='active'?'已開通':o.status==='done'?'報告已完成':'已停用'}</span></div><p class="muted">${esc(o.id)} · ${esc(o.created)} · ${o.test?'免費測試':'模擬付款'}</p>${o.status==='pending'?'<p>訂單已送出。請管理員到測試後台核對並開通。</p>':''}${o.status==='active'?`<button class="btn" onclick="openOrder('${o.id}')">開始抽牌</button>`:''}${o.status==='done'?`<button class="btn alt" onclick="openOrder('${o.id}')">重新查看原報告</button>`:''}${o.status==='disabled'?'<p>這筆訂單目前無法使用，請聯絡管理員。</p>':''}</div>`).join(''):'<p>目前沒有訂單。</p>'}<button class="btn alt" onclick="go('home')">回首頁</button></div>${info()}`}
function openOrder(id){current=orders.find(x=>x.id===id);go(current.status==='done'?'report':'draw')}
function adminPage(a){a.innerHTML=`<div class="panel"><div class="step">管理員後台 · 本機操作預覽</div><h2>訂單與測試權限</h2><div class="notice">⚠ 這不是安全的正式管理後台。所有人在這個測試檔案中都能開啟此頁，請勿用於真實收款或正式客戶資料。</div><div class="row"><b>允許新增免費測試</b><span class="status">${settings.test?'開放':'關閉'}</span></div><button class="btn ${settings.test?'danger':'alt'}" onclick="toggleTest()">${settings.test?'關閉免費測試':'開啟免費測試'}</button><p class="muted">關閉後不再允許新測試開通；已開通訂單可個別停用。</p><div class="rule"></div>${orders.length?orders.map(o=>`<div class="panel"><div class="row"><b>${esc(o.topic)}</b><span class="status">${esc(o.status)}</span></div><p class="muted">${esc(o.id)} · ${esc(o.name||'未填姓名')} · ${o.test?'測試':'一般'}</p>${o.status==='pending'?`<button class="btn alt" onclick="activate('${o.id}',false)">模擬確認收款</button><button class="btn" ${settings.test?'':'disabled'} onclick="activate('${o.id}',true)">免費測試開通一次</button>`:''}${o.status==='active'?`<button class="btn danger" onclick="disable('${o.id}')">停用這筆權限</button>`:''}${o.status==='done'?'<p>已完成一次抽牌，僅能重看原報告。</p>':''}${o.status==='disabled'?'<p>已停用。</p>':''}</div>`).join(''):'<p>尚無訂單。可先到付費流程建立模擬訂單。</p>'}</div>`}
function toggleTest(){settings.test=!settings.test;save('oracle_settings',settings);render()}function activate(id,test){if(test&&!settings.test)return;let o=orders.find(x=>x.id===id);if(!o||o.status!=='pending')return;o.status='active';o.test=test;save('oracle_orders',orders);render()}function disable(id){let o=orders.find(x=>x.id===id);if(o&&o.status==='active'){o.status='disabled';save('oracle_orders',orders);render()}}
function drawPage(a){if(current.status!=='active'){go('orders');return}a.innerHTML=`<div class="panel"><div class="step">付費神諭 · 第四步</div><h2>親手抽取你的神諭牌</h2><p>從52張牌背中選擇一張。抽牌完成後，這筆訂單就不能重新抽取。</p><div class="card-grid">${names.map((_,i)=>`<button class="oracle" title="第${i+1}張牌背" onclick="draw(${i})">☾</button>`).join('')}</div><p class="muted">正逆位由系統隨機決定。測試版使用程式隨機抽取，尚未接入原版牌面圖片。</p></div>`}
function draw(index){if(current.status!=='active')return;let b=new Uint32Array(2);crypto.getRandomValues(b);current.card=b[0]%52;current.reverse=!!(b[1]%2);current.chosen=index;current.status='done';current.drawDate=today();orders=orders.map(x=>x.id===current.id?current:x);save('oracle_orders',orders);go('report')}
function weeklyReport(a){let o=current;if(o.status!=='done'){go('orders');return}let i=o.card,k=keys[i],rev=o.reverse,focus=o.topic===topics[0]?'關係的互動與界線':o.topic===topics[1]?'工作安排與長期選擇':o.topic===topics[2]?'現金流與風險判斷':'內在需求與自我整理';let situation=o.story?`你在現況欄留下了這段敘述：「${esc(o.story)}」。這是你目前真正需要被理解的背景；正式 AI 版本會逐項辨識其中的時間線、轉折、情緒與主要疑問，而不只把文字原封不動放進報告。`:'你沒有填寫詳細現況，因此這份示範報告只能提供較廣泛的方向，不會替你編造曾發生的事件。';a.innerHTML=`<div class="panel report"><div class="step">${fmt(o.drawDate)} 起 · 未來七天</div><h2>${esc(o.topic)}｜完整七日神諭報告</h2><p class="muted">${esc(o.name||'訪客')} · 訂單 ${esc(o.id)} · ${o.test?'免費測試':'模擬付款'}</p><div class="notice"><b>本次抽到：</b>第${i}張｜${names[i]}｜${rev?'逆位':'正位'}<br><b>核心關鍵字：</b>${k}</div><h3>01｜本週整體趨勢</h3><p>接下來七天，這個主題值得關注的不是單一結果，而是你如何回應正在變化的情境。以「${focus}」為中心，先確認哪些事實已經清楚、哪些仍屬於猜測。把期待與現實分開，能讓你在不確定中保有選擇的空間。</p><h3>02｜你目前的處境與核心問題</h3><p>${situation}</p><p>${o.hasperson?`你選擇了「有特定對象」，目前關係標記為「${esc(o.relation)}」。${o.person?'你稱呼對方為「'+esc(o.person)+'」。':''}對方是否會主動、心裡怎麼想，仍需要透過實際行為與溝通確認；占卜無法直接讀取對方的私人想法。`:'本次沒有指定特定對象，因此建議先釐清自己真正重視的關係、目標或內在需求。'}</p><h3>03｜神諭牌的象徵與命理交叉解讀</h3><p>第${i}張「${names[i]}」以「${k}」作為這次的象徵線索。${rev?'逆位提醒你：可能有某種過度用力、拖延或忽略自身需求的狀態，值得重新檢視。':'正位鼓勵你：把已經理解的原則化為穩定而具體的行動，不必急於證明結果。'}這張牌不是替你宣布命運，而是協助你從不同角度重新理解現況。</p><p>${o.birth?'依你提供的國曆生日，生命靈數為 '+life(o.birth)+'。這個數字在本次僅作為象徵性自我觀察，不代替完整八字排盤。':'你尚未提供生日，這份示範不會假裝已經完成個人命盤計算。'}</p><h3>04｜未來七天的發展節奏</h3><p><b>第1～2天：</b>先觀察現況，整理最近發生的事。避免因短暫情緒而立即做出不可逆的決定。</p><p><b>第3～4天：</b>適合處理需要溝通或確認的細節。若對方的態度、工作安排或財務資訊仍不明確，優先提出具體問題。</p><p><b>第5～6天：</b>檢視前幾天的反應與結果。若發現自己不斷重複同一個困境，可考慮調整投入方式，而不是一再加大力道。</p><p><b>第7天：</b>做一次回顧：哪些事情有證據支持、哪些只是期待？決定下一週要繼續、暫緩或重新設定界線。</p><h3>05｜具體行動建議</h3><p>先寫下你希望改善的一件事，再為它設定一個可以觀察的行動，例如完成一次清楚的對話、確認一項工作條件、檢查一筆支出，或安排固定的休息時間。比起要求自己立刻得到答案，持續觀察實際變化更能幫助判斷。</p><h3>06｜本週宜忌</h3><p><b>宜：</b>確認事實、照顧界線、循序行動、記錄重要轉折。<br><b>忌：</b>單憑猜測下結論、為求安心反覆試探、忽略現實限制。</p><h3>07｜本週神諭總結</h3><p>「${k}」提醒你的，不是一定要往某個方向走，而是看清楚自己有什麼選擇。當你能分辨期待、恐懼與現實，接下來的決定就更可能符合真正的需要。七天後再回頭看，你會更清楚哪些改變來自外界，哪些來自自己的行動。</p><div class="rule"></div><div class="notice">本報告為離線測試模板，已示範抽牌、正逆位、主題與現況欄位的串接；尚未接 AI 深度分析、真實八字與農民曆計算，因此不代表正式付費報告的最終品質。</div><button class="btn alt" onclick="go('orders')">返回我的訂單（可重看報告）</button></div>`}
render();</script></body></html>
